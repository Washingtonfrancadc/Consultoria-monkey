<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Consultoria - Área do Aluno</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-principal: #0b0f19;
            --bg-card: #1f2937;
            --cor-neon: #a3e635; /* Verde limão/neon da Monkey */
            --texto-claro: #f3f4f6;
            --texto-mutado: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: var(--bg-principal); color: var(--texto-claro); padding-bottom: 60px; }

        .header-consultoria { text-align: center; padding: 30px 20px; background: linear-gradient(180deg, #111827 0%, var(--bg-principal) 100%); }
        .header-consultoria h1 { color: var(--texto-claro); font-size: 28px; letter-spacing: 1px; }
        .header-consultoria h1 span { color: var(--cor-neon); }
        .header-consultoria p { color: var(--texto-mutado); font-style: italic; font-size: 14px; margin-top: 5px; }

        /* Menu de Abas */
        .menu-abas { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; padding: 0 15px; }
        .aba-link { background: #111827; border: 1px solid #374151; color: var(--texto-mutado); padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; flex: 1; max-width: 150px; text-align: center; }
        .aba-link.ativa { background: var(--cor-neon); color: #000; border-color: var(--cor-neon); }

        .app-container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
        .conteudo-aba { display: none; }
        .conteudo-aba.ativa { display: block; }

        /* Blocos e Secções */
        .bloco-secao { background: var(--bg-card); border-radius: 12px; margin-bottom: 15px; border: 1px solid #374151; overflow: hidden; }
        .header-bloco { display: flex; align-items: center; justify-content: space-between; padding: 16px; cursor: pointer; position: relative; z-index: 2; }
        .titulo-secao { font-weight: bold; font-size: 16px; display: flex; align-items: center; width: 100%; }
        .seta-recolher { margin-left: auto; transition: transform 0.5s ease; color: var(--texto-mutado); }
        .bloco-secao.expandido .seta-recolher { transform: rotate(180deg); }
        
        /* Animação do Corpo do Accordion */
        .corpo-recolhivel { 
            max-height: 0; 
            opacity: 0; 
            overflow: hidden; 
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            padding: 0 16px;
        }
        .bloco-secao.expandido .corpo-recolhivel { 
            max-height: 2000px; /* Valor alto o suficiente para comportar o conteúdo livremente */
            opacity: 1; 
            padding: 0 16px 16px 16px;
        }

        /* Estilo para agrupamento secundário interno (Refeições) */
        .bloco-refeicao-interno { background: #111827; border-radius: 8px; border: 1px solid #374151; margin-top: 10px; margin-bottom: 10px; padding: 12px; }
        .titulo-refeicao-interna { font-size: 14px; font-weight: bold; color: var(--texto-claro); border-bottom: 1px solid #374151; padding-bottom: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; }

        /* Tabelas de Treino e Dieta */
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th { text-align: left; color: var(--texto-mutado); font-size: 12px; padding-bottom: 8px; text-transform: uppercase; }
        td { padding: 12px 0; border-top: 1px solid #374151; font-size: 14px; vertical-align: middle; }

        /* Linha injetada do GIF */
        .linha-gif-exercicio td { padding: 0; border-top: none; text-align: center; }

        /* Container do GIF centralizado 364x364 com transições */
        .wrapper-gif-dinamico { 
            max-width: 364px; 
            width: 100%;
            height: 364px; 
            background: #000; 
            border-radius: 8px; 
            border: 1px solid var(--cor-neon); 
            margin: 10px auto 15px auto;
            overflow: hidden;
            display: block;
            transition: max-height 0.5s ease-in-out, opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            max-height: 0;
            opacity: 0;
            transform: scale(0.9);
        }
        .wrapper-gif-dinamico.ativo {
            max-height: 364px;
            opacity: 1;
            transform: scale(1);
        }
        .wrapper-gif-dinamico iframe { width: 100%; height: 100%; border: none; display: block; }

        /* Macros da Dieta */
        .resumo-macros { display: flex; justify-content: space-between; margin-top: 15px; background: #0f172a; padding: 12px; border-radius: 8px; gap: 5px; }
        .macro-box { text-align: center; flex: 1; }
        .macro-box p { font-size: 11px; color: var(--texto-mutado); text-transform: uppercase; }
        .macro-box div { font-size: 14px; font-weight: bold; margin-top: 4px; color: var(--texto-claro); }

        /* Formulário de Evolução */
        .campo-form { margin-bottom: 15px; }
        .campo-form label { display: block; color: var(--texto-mutado); font-size: 13px; margin-bottom: 6px; }
        .input-texto { width: 100%; background: #111827; border: 1px solid #374151; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; }
        .input-texto:focus { border-color: var(--cor-neon); outline: none; }
        
        /* Upload Customizado */
        .upload-container { position: relative; width: 100%; background: #111827; border: 2px dashed #374151; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; }
        .upload-container:hover { border-color: var(--cor-neon); }
        .upload-container input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .preview-imagem { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 6px; display: none; }

        .btn-enviar { width: 100%; background: var(--cor-neon); color: #000; font-weight: bold; padding: 14px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-enviar:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header-consultoria">
        <h1>MONKEY <span>CONSULTORIA</span></h1>
        <p>liberte o gorila dentro de você</p>
    </div>

    <div class="menu-abas">
        <div class="aba-link ativa" data-aba="aba-treino"><i class="fa-solid fa-dumbbell"></i> Treino</div>
        <div class="aba-link" data-aba="aba-dieta"><i class="fa-solid fa-apple-whole"></i> Dieta</div>
        <div class="aba-link" data-aba="aba-evolucao"><i class="fa-solid fa-chart-line"></i> Evolução</div>
    </div>

    <div class="app-container">

        <div id="aba-treino" class="conteudo-aba ativa">
            <div id="container-blocos-treino"></div>
        </div>

        <div id="aba-dieta" class="conteudo-aba">
            <div id="conteudo-refeicoes-dinamicas"></div>
        </div>

        <div id="aba-evolucao" class="conteudo-aba">
            <div class="bloco-secao expandido" style="border-color: var(--cor-neon);">
                <div class="header-bloco" style="cursor: default;">
                    <div class="titulo-secao" style="color: var(--cor-neon);"><i class="fa-solid fa-comment-dots" style="margin-right: 8px;"></i> Relatório de Evolução Semanal</div>
                </div>
                <div class="corpo-recolhivel">
                    <div class="campo-form">
                        <label>Como foi a adesão ao plano de treino e dieta nesta semana?</label>
                        <textarea id="feedback-texto" class="input-texto" rows="5" placeholder="Conte-me sobre sua força, cansaço, falhas na dieta ou dores..."></textarea>
                    </div>

                    <div class="campo-form">
                        <label>Foto de Evolução (Frente, Lado ou Costas)</label>
                        <div class="upload-container">
                            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 24px; color: var(--cor-neon); margin-bottom: 8px;"></i>
                            <p id="upload-status" style="font-size: 13px;">Clique aqui para selecionar ou tirar a foto</p>
                            <input type="file" id="feedback-foto" accept="image/*" onchange="capturarPreviewFoto(this)">
                            <img id="img-preview" class="preview-imagem" src="" alt="Preview">
                        </div>
                    </div>

                    <button id="btn-enviar-feedback" class="btn-enviar" onclick="enviarFeedbackCompleto()">
                        <i class="fa-solid fa-paper-plane"></i> Enviar Atualização 🦍
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://wtaluaiatlguefgwuuxy.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_XWA4yh4y8ShcWjg88jfKlg_YYNbFX2g'; 
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let dadosDoAluno = { rotinasTreino: [], rotinasDieta: [] };
        let alunoIdSelecionado = "";
        let idExercicioComGifAberto = null;
        let arquivoFotoSelecionado = null;

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            alunoIdSelecionado = urlParams.get('id');

            if(!alunoIdSelecionado) {
                document.body.innerHTML = `<div style="text-align:center; padding:50px; color:var(--texto-mutado);">
                    <h2>Acesso Restrito</h2><p style="margin-top:10px;">Por favor, utilize o link direto fornecido pelo seu treinador.</p>
                </div>`;
                return;
            }

            await puxarDadosDoAlunoDoBanco();
            configureTabs();
        };

        async function puxarDadosDoAlunoDoBanco() {
            // Treinos
            let { data: blocos } = await _supabase.from('treinos_blocos').select('*').eq('aluno_id', alunoIdSelecionado).order('ordem');
            let treinos = [];
            if(blocos) {
                for(let b of blocos) {
                    let { data: exs } = await _supabase.from('treinos_exercicios').select('*').eq('bloco_id', b.id);
                    treinos.push({ idBloco: b.id, nomeBloco: b.nome_bloco, exercicios: exs || [] });
                }
            }

            // Dietas
            let { data: dias } = await _supabase.from('dieta_dias').select('*').eq('aluno_id', alunoIdSelecionado).order('ordem');
            let dietas = [];
            if(dias) {
                for(let d of dias) {
                    let { data: alims } = await _supabase.from('dieta_alimentos').select('*').eq('dia_id', d.id);
                    let refs = {};
                    if(alims) {
                        alims.forEach(al => {
                            if(!refs[al.nome_refeicao]) refs[al.nome_refeicao] = { nomeRefeicao: al.nome_refeicao, alimentos: [] };
                            let q = al.quantidade;
                            refs[al.nome_refeicao].alimentos.push({
                                id: al.id, nome: al.nome_alimento, quantidade: q,
                                carboTotal: Number((al.carbo_g * q).toFixed(1)), protTotal: Number((al.prot_g * q).toFixed(1)), gordTotal: Number((al.gord_g * q).toFixed(1)), kcalTotal: Number((al.kcal_g * q).toFixed(0))
                            });
                        });
                    }
                    dietas.push({ idDia: d.id, nomeDia: d.nome_dia, refeicoes: Object.values(refs) });
                }
            }

            dadosDoAluno.rotinasTreino = treinos;
            dadosDoAluno.rotinasDieta = dietas;
            
            renderizarModoAluno();
        }

        function renderizarModoAluno() {
            // Renderização da aba de Treinos
            document.getElementById('container-blocos-treino').innerHTML = dadosDoAluno.rotinasTreino.map(b => `
                <div class="bloco-secao" id="${b.idBloco}">
                    <div class="header-bloco" onclick="alternarBlocoLayout('${b.idBloco}', 'treino')">
                        <div class="titulo-secao">${b.nomeBloco} <i class="fa-solid fa-chevron-down seta-recolher"></i></div>
                    </div>
                    <div class="corpo-recolhivel">
                        <table>
                            <thead><tr><th>Exercício</th><th>Séries</th><th>Reps</th><th>Desc.</th></tr></thead>
                            <tbody>
                                ${b.exercicios.map(ex => `
                                    <tr id="linha-ex-${ex.id}">
                                        <td style="color:var(--cor-neon); cursor:pointer;" onclick="gerenciarIframeInjetado('${ex.id}', '${ex.gif_url}')">
                                            <i class="fa-solid fa-play-circle" style="margin-right:5px;"></i>${ex.nome}
                                        </td>
                                        <td>${ex.series}</td>
                                        <td>${ex.reps}</td>
                                        <td>${ex.descanso}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');

            // Renderização da aba de Dieta
            if(dadosDoAluno.rotinasDieta.length === 0) {
                document.getElementById('conteudo-refeicoes-dinamicas').innerHTML = '<p style="text-align:center; padding:20px; color:var(--texto-mutado);">Nenhum protocolo ativo de dieta encontrado.</p>';
            } else {
                document.getElementById('conteudo-refeicoes-dinamicas').innerHTML = dadosDoAluno.rotinasDieta.map(dia => {
                    let diaKcal = 0, diaCarbo = 0, diaProt = 0, diaGord = 0;
                    dia.refeicoes.forEach(ref => {
                        ref.alimentos.forEach(al => {
                            diaKcal += al.kcalTotal; diaCarbo += al.carboTotal; diaProt += al.protTotal; diaGord += al.gordTotal;
                        });
                    });

                    let htmlRefeicoesInternas = dia.refeicoes.map(ref => {
                        let refKcal = 0, refCarbo = 0, refProt = 0, refGord = 0;
                        let linhasAlimentos = ref.alimentos.map(al => {
                            refKcal += al.kcalTotal; refCarbo += al.carboTotal; refProt += al.protTotal; refGord += al.gordTotal;
                            return `<tr><td>${al.nome}</td><td>${al.quantidade}g</td><td style="font-size:12px; color:var(--texto-mutado);">${Math.round(al.carboTotal)}g C / ${Math.round(al.protTotal)}g P / ${Math.round(al.gordTotal)}g G</td></tr>`;
                        }).join('');

                        return `
                            <div class="bloco-refeicao-interno">
                                <div class="titulo-refeicao-interna">
                                    <span>${ref.nomeRefeicao}</span>
                                    <span style="color: var(--cor-neon); font-size:13px;">${Math.round(refKcal)} Kcal</span>
                                </div>
                                <table>
                                    <thead><tr><th>Alimento</th><th>Qtd</th><th>Macros</th></tr></thead>
                                    <tbody>${linhasAlimentos}</tbody>
                                </table>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="bloco-secao" id="${dia.idDia}">
                            <div class="header-bloco" onclick="alternarBlocoLayout('${dia.idDia}', 'dieta')">
                                <div class="titulo-secao">
                                    ${dia.nomeDia} 
                                    <span style="font-size:13px; color:var(--cor-neon); margin-left:auto; margin-right:12px; font-weight:bold;">
                                        Total: ${Math.round(diaKcal)} Kcal
                                    </span> 
                                    <i class="fa-solid fa-chevron-down seta-recolher"></i>
                                </div>
                            </div>
                            <div class="corpo-recolhivel">
                                ${htmlRefeicoesInternas}
                                <div class="resumo-macros">
                                    <div class="macro-box"><p>Kcal Dia</p><div style="color:var(--cor-neon);">${Math.round(diaKcal)}</div></div>
                                    <div class="macro-box"><p>Carbo</p><div>${Math.round(diaCarbo)}g</div></div>
                                    <div class="macro-box"><p>Prot</p><div>${Math.round(diaProt)}g</div></div>
                                    <div class="macro-box"><p>Gord</p><div>${Math.round(diaGord)}g</div></div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        // Executa a transição de sanfona minimizando os demais blocos abertos
        function alternarBlocoLayout(id, tipoAba) {
            const elClicado = document.getElementById(id);
            if (!elClicado) return;

            const containerPaiId = tipoAba === 'treino' ? 'container-blocos-treino' : 'conteudo-refeicoes-dinamicas';
            const todosOsBlocos = document.getElementById(containerPaiId).querySelectorAll('.bloco-secao');
            const jaEstavaExpandido = elClicado.classList.contains('expandido');

            // Se for treino, recolhe o player antes de fechar o bloco completo
            if (tipoAba === 'treino') {
                removerLinhaGifComAnimacao();
                idExercicioComGifAberto = null;
            }

            // Minimiza todos os blocos ativos da mesma seção
            todosOsBlocos.forEach(bloco => {
                bloco.classList.remove('expandido');
            });

            // Se o bloco alvo estava fechado, expande ele
            if (!jaEstavaExpandido) {
                elClicado.classList.add('expandido');
                setTimeout(() => {
                    elClicado.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 150);
            }
        }

        // Injeta e coordena a exibição do player 364x364 centralizado com animação
        function gerenciarIframeInjetado(exId, url) {
            const linhaEx = document.getElementById(`linha-ex-${exId}`);
            if (!linhaEx) return;

            // Caso clique no exercício que já está aberto, executa animação de fechamento
            if (idExercicioComGifAberto === exId) {
                removerLinhaGifComAnimacao();
                idExercicioComGifAberto = null;
                return;
            }

            // Se houver outro GIF aberto em outro exercício, remove primeiro
            removerLinhaGifComAnimacao();

            // Monta o elemento da linha e o wrapper estruturado
            const novaLinha = document.createElement('tr');
            novaLinha.id = 'linha-gif-dinamica';
            novaLinha.className = 'linha-gif-exercicio';
            novaLinha.innerHTML = `
                <td colspan="4">
                    <div class="wrapper-gif-dinamico" id="wrapper-gif-elemento">
                        <iframe src="${url}" allow="autoplay"></iframe>
                    </div>
                </td>
            `;

            linhaEx.parentNode.insertBefore(novaLinha, linhaEx.nextSibling);
            idExercicioComGifAberto = exId;

            // Trigger sutil para ativar a animação de entrada controlada pelo CSS
            setTimeout(() => {
                const wrapper = document.getElementById('wrapper-gif-elemento');
                if (wrapper) wrapper.classList.add('ativo');
            }, 20);
        }

        // Remove a linha do iframe aplicando efeito suave de fade/colapso antes de deletar do DOM
        function removerLinhaGifComAnimacao() {
            const linhaExistente = document.getElementById('linha-gif-dinamica');
            const wrapper = document.getElementById('wrapper-gif-elemento');
            
            if (linhaExistente && wrapper) {
                wrapper.classList.remove('ativo'); // Inicia animação de saída reversa do CSS
                linhaExistente.id = 'linha-gif-deletando'; // Evita conflitos de ID durante o delay de transição
                
                setTimeout(() => {
                    linhaExistente.remove();
                }, 400); // Sincronizado com o tempo de transition do CSS (.4s)
            }
        }

        function configureTabs() {
            document.querySelectorAll('.menu-abas .aba-link').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.menu-abas .aba-link').forEach(b => b.classList.remove('ativa'));
                    document.querySelectorAll('.conteudo-aba').forEach(c => c.classList.remove('ativa'));
                    btn.classList.add('ativa'); 
                    document.getElementById(btn.dataset.aba).classList.add('ativa');
                    
                    // Reseta os estados e limpa os ifs ao alternar as abas do app
                    removerLinhaGifComAnimacao();
                    idExercicioComGifAberto = null;
                });
            });
        }

        function capturarPreviewFoto(input) {
            const file = input.files[0];
            const preview = document.getElementById('img-preview');
            const statusText = document.getElementById('upload-status');
            
            if (file) {
                arquivoFotoSelecionado = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    statusText.innerText = "Foto selecionada: " + file.name;
                }
                reader.readAsDataURL(file);
            }
        }

        async function enviarFeedbackCompleto() {
            const texto = document.getElementById('feedback-texto').value.trim();
            const btn = document.getElementById('btn-enviar-feedback');
            
            if(!texto) return alert("Por favor, preencha o seu comentário semanal.");
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';

            let urlPublicaFoto = null;

            try {
                if (arquivoFotoSelecionado) {
                    const extensao = arquivoFotoSelecionado.name.split('.').pop();
                    const nomeArquivo = `${alunoIdSelecionado}/${Date.now()}.${extensao}`;

                    let { error: uploadError } = await _supabase.storage
                        .from('fotos-evolucao')
                        .upload(nomeArquivo, arquivoFotoSelecionado);

                    if (uploadError) throw uploadError;
                    urlPublicaFoto = `${SUPABASE_URL}/storage/v1/object/public/fotos-evolucao/${nomeArquivo}`;
                }

                const { error: insertError } = await _supabase
                    .from('feedbacks_alunos')
                    .insert({
                        aluno_id: alunoIdSelecionado,
                        comentario: texto,
                        foto_url: urlPublicaFoto
                    });

                if (insertError) throw insertError;

                alert("Boa, o relatório foi enviado com sucesso! O gorila tá evoluindo! 🦍");
                
                document.getElementById('feedback-texto').value = "";
                document.getElementById('feedback-foto').value = "";
                document.getElementById('img-preview').style.display = 'none';
                document.getElementById('upload-status').innerText = "Clique aqui para selecionar ou tirar a foto";
                arquivoFotoSelecionado = null;

            } catch (err) {
                console.error(err);
                alert("Ocorreu um erro ao processar o envio. Tente novamente.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Atualização 🦍';
            }
        }
    </script>
</body>
</html>
